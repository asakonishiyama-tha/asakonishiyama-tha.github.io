name: Continuous integration

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and scan public-source candidate
        env:
          PUBLIC_SOURCE_CANDIDATE: ${{ runner.temp }}/public-source-candidate
        run: |-
          mkdir -m 700 -- "$PUBLIC_SOURCE_CANDIDATE"
          npm run release:prepare -- --output "$PUBLIC_SOURCE_CANDIDATE"
          node "$PUBLIC_SOURCE_CANDIDATE/scripts/scan-release-safety.mjs" "$PUBLIC_SOURCE_CANDIDATE"
      - name: Validate content
        run: npm run validate:content
      - name: Validate assets
        run: npm run validate:assets
      - name: Run unit tests
        run: npm test
      - name: Check types
        run: npm run typecheck
      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_URL: https://asakonishiyama-tha.github.io
          NEXT_PUBLIC_PRIVACY_POLICY_URL: ""
          NEXT_PUBLIC_GAS_WEB_APP_URL: ""
        run: npm run build
      - name: Verify static site
        run: npm run verify:static
      - name: Scan static output
        run: npm run release:scan -- out
      - name: Run browser tests
        run: npm run test:e2e
